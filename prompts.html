<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instrução e frases da Júlia</title>
<style>
:root{
  --fundo:#f4f5f3; --papel:#fff; --tinta:#1d2320; --fraco:#6b756f; --linha:#dfe3df;
  --verde:#1f7a4d; --verde-fraco:#e7f3ec; --cinza-fraco:#eceeec; --amarelo:#b07d12;
  --amarelo-fraco:#fdf3dd; --bolha-ia:#e9f3ec; --bolha-gente:#fff; --grupo:#f0f2f5;
  --roxo:#6b3fa0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fundo:#14181a; --papel:#1b2022; --tinta:#e6ebe8; --fraco:#93a09a; --linha:#2b3236;
  --verde:#5fc38d; --verde-fraco:#1c2d24; --cinza-fraco:#232a2c; --amarelo:#e0b45c;
  --amarelo-fraco:#2f2716; --bolha-ia:#1f2f27; --bolha-gente:#242b2e; --grupo:#20272a;
  --roxo:#c3a1e8;
}}
:root[data-theme="dark"]{
  --fundo:#14181a; --papel:#1b2022; --tinta:#e6ebe8; --fraco:#93a09a; --linha:#2b3236;
  --verde:#5fc38d; --verde-fraco:#1c2d24; --cinza-fraco:#232a2c; --amarelo:#e0b45c;
  --amarelo-fraco:#2f2716; --bolha-ia:#1f2f27; --bolha-gente:#242b2e; --grupo:#20272a;
  --roxo:#c3a1e8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--tinta);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--papel);border-bottom:1px solid var(--linha);
  padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--fraco);font-size:13px}
.espaco{flex:1}
button{font:inherit;font-size:13px;padding:7px 13px;border:1px solid var(--linha);
  background:var(--papel);color:var(--tinta);border-radius:7px;cursor:pointer}
button:hover{border-color:var(--fraco)}
button.forte{background:var(--verde);border-color:var(--verde);color:#fff}
button.forte[disabled]{opacity:.4;cursor:default}
select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--linha);
  background:var(--papel);color:var(--tinta);border-radius:7px}
.nav{font-size:13px;color:var(--fraco);text-decoration:none;border:1px solid var(--linha);
  padding:7px 13px;border-radius:7px}
.nav:hover{border-color:var(--fraco);color:var(--tinta)}
main{max-width:1180px;margin:0 auto;padding:24px 20px 90px}
.func{background:var(--papel);border:1px solid var(--linha);border-radius:12px;
  padding:18px 20px;margin:0 0 18px}
.func h2{font-size:16px;margin:0 0 4px;font-weight:620}
.nota{color:var(--fraco);font-size:13px;margin:6px 0 0;max-width:75ch}
.pill{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--cinza-fraco);
  color:var(--fraco);margin-left:8px;white-space:nowrap}
.pill.ar{background:var(--verde-fraco);color:var(--verde)}
.pill.f4{background:var(--amarelo-fraco);color:var(--amarelo)}
.chave{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fraco);
  border:1px solid var(--linha);padding:4px 6px;border-radius:5px;margin-right:8px}
.bloco{margin-top:12px;border:1px solid var(--linha);border-radius:10px;overflow:hidden}
.bloco>.cap{padding:8px 12px;background:var(--cinza-fraco);font-size:12px;color:var(--fraco);
  display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.txt{white-space:pre-wrap;word-break:break-word;outline:none;padding:12px;
  background:var(--papel);font-size:14px}
.txt:focus{box-shadow:inset 0 0 0 2px var(--verde)}
.bloco.mudou{border-color:var(--amarelo)}
.bloco.mudou>.cap{background:var(--amarelo-fraco);color:var(--amarelo)}
.marca{color:var(--roxo);font-weight:600}
.aviso{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tinta);
  color:var(--fundo);padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;
  transition:opacity .2s;pointer-events:none}
.aviso.on{opacity:1}
</style>
</head>
<body>
<header>
  <div><h1>Instrução e frases da Júlia</h1>
  <div class="sub" id="placar">carregando…</div></div>
  <select id="quem"></select>
  <div class="espaco"></div>
  <a class="nav" href="index.html">O que a Júlia escreve</a>
  <a class="nav" href="gabarito.html">O gabarito</a>
  <button id="baixar">Baixar prompts.json</button>
  <button id="descartar">Descartar edições</button>
  <button id="salvar" class="forte" disabled>Salvar</button>
</header>
<main id="tela"></main>
<div class="aviso" id="aviso"></div>
<script>
const EDIT = "qa-prompts-edicoes";
const QUEM = "qa-prompts-quem";
let dados = null, edicoes = JSON.parse(localStorage.getItem(EDIT) || "{}"), quem = null;

const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
// {paciente}, {quando}: é texto normal, só fica colorido pra você achar de olho
const marcar = s => esc(s).replace(/\{[^{}\n]+\}/g, m => `<span class="marca">${m}</span>`);

function bloco(k, cap, fonte, texto, pintar){
  const v = edicoes[k] !== undefined ? edicoes[k] : texto;
  return `<div class="bloco${edicoes[k] !== undefined ? " mudou" : ""}" data-bloco="${k}">
    <div class="cap"><b>${cap}</b><span>${esc(fonte)}</span></div>
    <div class="txt" contenteditable="plaintext-only" data-k="${k}">${
      pintar ? marcar(v) : esc(v)}</div>
  </div>`;
}

function desenha(){
  const t = dados.tenants.find(x => x.id === quem) || dados.tenants[0];
  quem = t.id;
  document.getElementById("quem").value = quem;
  const c = dados.contrato;
  document.getElementById("tela").innerHTML = `
    <section class="func">
      <h2>${esc(c.titulo)}<span class="pill ar">igual pra todo cliente</span></h2>
      <p class="nota">${esc(c.aviso)}</p>
      ${bloco("contrato", "A instrução comum", c.fonte, c.texto, false)}
    </section>
    <section class="func">
      <h2>Quem é a Júlia para ${esc(t.nome)}
        <span class="pill ${t.teste ? "f4" : "ar"}">${t.teste ? "cliente de teste" : "cliente de verdade"}</span></h2>
      <p class="nota">Este texto entra no lugar da primeira linha da instrução comum, e vale só para ${esc(t.id)}.</p>
      ${bloco(`${t.id}|prompt`, "O texto do cliente", t.prompt_fonte, t.system_prompt, false)}
    </section>
    <section class="func">
      <h2>Frases prontas de ${esc(t.nome)}<span class="pill">${t.snippets.length} frases</span></h2>
      <p class="nota">A Júlia manda estas frases palavra por palavra. O que está entre chaves é
        preenchido na hora com o dado do paciente: escreva como texto normal.</p>
      ${t.snippets.map(s => bloco(`${t.id}|frase|${s.key}`,
          `<span class="chave">${esc(s.key)}</span>`, t.snippets_fonte, s.text, true)).join("")}
    </section>`;
  const reais = dados.tenants.filter(x => !x.teste).length;
  document.getElementById("placar").textContent =
    `${reais} clientes · ${dados.tenants.length - reais} de teste · ${Object.keys(edicoes).length} blocos editados`;
  document.getElementById("salvar").disabled = !Object.keys(edicoes).length;
}

function opcoes(){
  const grupo = (rotulo, lista) => !lista.length ? "" :
    `<optgroup label="${rotulo}">${lista.map(t =>
      `<option value="${t.id}">${esc(t.nome)} (${esc(t.id)})</option>`).join("")}</optgroup>`;
  document.getElementById("quem").innerHTML =
    grupo("Clientes", dados.tenants.filter(t => !t.teste)) +
    grupo("Testes", dados.tenants.filter(t => t.teste));
}

document.addEventListener("input", e => {
  const el = e.target.closest(".txt"); if(!el) return;
  edicoes[el.dataset.k] = el.innerText;
  localStorage.setItem(EDIT, JSON.stringify(edicoes));
  el.closest(".bloco").classList.add("mudou");
  document.getElementById("salvar").disabled = false;
});

document.getElementById("quem").onchange = e => {
  quem = e.target.value; localStorage.setItem(QUEM, quem); desenha();
};

function aplicado(){
  // as edições entram numa cópia: o objeto da tela continua sendo o arquivo como está no disco
  const copia = JSON.parse(JSON.stringify(dados));
  if(edicoes["contrato"] !== undefined) copia.contrato.texto = edicoes["contrato"];
  for(const t of copia.tenants){
    const p = edicoes[`${t.id}|prompt`];
    if(p !== undefined) t.system_prompt = p;
    for(const s of t.snippets){
      const v = edicoes[`${t.id}|frase|${s.key}`];
      if(v !== undefined) s.text = v;
    }
  }
  return copia;
}

function avisar(t){
  const a = document.getElementById("aviso");
  a.textContent = t; a.classList.add("on");
  setTimeout(() => a.classList.remove("on"), 2600);
}

document.getElementById("salvar").onclick = async () => {
  const corpo = JSON.stringify(aplicado(), null, 1);
  try{
    const r = await fetch("/salvar?arquivo=prompts.json", {method:"POST", body:corpo});
    if(!r.ok) throw new Error(r.status);
    dados = JSON.parse(corpo); edicoes = {}; localStorage.removeItem(EDIT);
    desenha(); avisar("Salvo no prompts.json");
  }catch(e){
    baixar(corpo);
    avisar("Sem servidor aqui: baixei o prompts.json pra você mandar pro Claude");
  }
};

function baixar(corpo){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([corpo], {type:"application/json"}));
  a.download = "prompts.json"; a.click(); URL.revokeObjectURL(a.href);
}
document.getElementById("baixar").onclick = () => baixar(JSON.stringify(aplicado(), null, 1));
document.getElementById("descartar").onclick = () => {
  if(!confirm("Jogar fora as edições que ainda não foram salvas?")) return;
  edicoes = {}; localStorage.removeItem(EDIT); desenha();
};

fetch("prompts.json").then(r => r.json()).then(d => {
  dados = d; quem = localStorage.getItem(QUEM); opcoes(); desenha();
}).catch(() => document.getElementById("tela").innerHTML =
  '<div class="func">Não consegui ler o <b>prompts.json</b>. Rode <code>python3 _shared/qa/servir.py</code> e abra pelo endereço que ele imprime.</div>');
</script>
</body>
</html>
